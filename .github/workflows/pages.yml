name: Publish Johansson Town

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The playable Town, without its development folders
        run: |
          set -eu
          site="$RUNNER_TEMP/site"
          rsync -a --exclude .git --exclude .github --exclude docs/ --exclude tests/ --exclude output/ --exclude node_modules/ ./ "$site/"
          bytes=$(du -sb "$site" | cut -f1)
          echo "Town site: $bytes bytes"
          # GitHub Pages refuses a site over 1 GB: stop well before it.
          test "$bytes" -lt 900000000
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
