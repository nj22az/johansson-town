<!doctype html><meta charset="utf-8"><body style="margin:0;background:#f3efe6"><canvas id="c"></canvas>
<script type="module">
import * as THREE from '../vendor/three.module.js';
import {buildAvatar} from '../src/avatars/build.js';
import {recipeFor,RESIDENT_NAMES} from '../src/avatars/cast.js';
import {createAvatarAnimator} from '../src/avatars/animate.js';
const base=['Johansson','Thuan','Thao','Nhung','Chin','Harbour master','Mrs Sato'];
const clamp=v=>Math.max(0,Math.min(1,v));
const VARIANTS=[
 ['now',r=>r],
 ['rounded',r=>({...r,body:{...r.body,proportion:'rounded'}})],
 ['rounded + bigger, lower eyes',r=>({...r,body:{...r.body,proportion:'rounded'},head:{...r.head,size:clamp((r.head?.size??.5)+.12),cheeks:clamp((r.head?.cheeks??.5)+.15)},eyes:{...r.eyes,size:clamp((r.eyes?.size??.5)+.28),spacing:clamp((r.eyes?.spacing??.5)+.08),height:clamp((r.eyes?.height??.5)-.14)},mouth:{...r.mouth,height:clamp((r.mouth?.height??.5)-.06)},blush:Math.max(r.blush??.25,.5)})],
];
const names=VARIANTS.flatMap(([label])=>base.map(n=>n+'|'+label));
const TW=260,TH=420,COLS=7,rows=Math.ceil(names.length/COLS);
const out=document.createElement('canvas');out.width=TW*COLS;out.height=TH*rows;const g=out.getContext('2d');g.fillStyle='#f3efe6';g.fillRect(0,0,out.width,out.height);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(TW,TH);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf3efe6);
scene.add(new THREE.HemisphereLight(0xfffbf2,0xb8ab96,1.5));const sun=new THREE.DirectionalLight(0xfff3df,2.0);sun.position.set(-1.2,2.6,2.4);scene.add(sun);
const cam=new THREE.PerspectiveCamera(24,TW/TH,.1,30);
const built=[];
for(const [i,name] of names.entries()){
 const [who,label]=name.split('|');const tweak=VARIANTS.find(v=>v[0]===label)[1];
 let a;try{a=buildAvatar(tweak(JSON.parse(JSON.stringify(recipeFor(who)))),{shadows:false,faceSize:256});}catch(e){console.log('FAIL',name,e.message);continue;}
 const holder=new THREE.Group();holder.rotation.y=Math.PI+.35;holder.add(a.root);scene.add(holder);
 try{const an=createAvatarAnimator(a,{random:()=>.5,initialTime:0});for(let k=0;k<20;k++)an.update(.05,{expression:'smile'});}catch(e){}
 const h=a.height||1.6;
 // full body in the upper 62%, face close-up in the lower 38%
 renderer.setSize(TW,Math.round(TH*.62));cam.aspect=TW/(TH*.62);cam.updateProjectionMatrix();cam.position.set(0,h*.52,h*2.9+1.4);cam.lookAt(0,h*.5,0);renderer.render(scene,cam);
 g.drawImage(renderer.domElement,(i%COLS)*TW,Math.floor(i/COLS)*TH);
 renderer.setSize(TW,Math.round(TH*.38)-22);cam.aspect=TW/(TH*.38-22);cam.updateProjectionMatrix();holder.rotation.y=Math.PI+.2;cam.position.set(0,h*.84,1.55);cam.lookAt(0,h*.83,0);renderer.render(scene,cam);
 g.drawImage(renderer.domElement,(i%COLS)*TW,Math.floor(i/COLS)*TH+Math.round(TH*.62));
 g.fillStyle='#1f2a2e';g.font='600 13px sans-serif';g.textAlign='center';g.fillText(who+' · '+label,(i%COLS)*TW+TW/2,Math.floor(i/COLS)*TH+TH-6);
 scene.remove(holder);built.push(name);
}
document.body.replaceChildren(out);window.__SHEET__={done:true,built,size:[out.width,out.height]};
</script>
