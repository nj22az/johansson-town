<!doctype html><meta charset="utf-8"><body style="margin:0;background:#f3efe6"><canvas id="c"></canvas>
<script type="module">
import * as THREE from '../vendor/three.module.js';
import {buildAvatar} from '../src/avatars/build.js';
import {recipeFor,RESIDENT_NAMES} from '../src/avatars/cast.js';
import {createAvatarAnimator} from '../src/avatars/animate.js';
const names=(new URLSearchParams(location.search).get('only')||'Johansson,Thuan,Thao,Chin,Harbour master,Vy').split(',');
const VIEWS=[['feet',(h)=>({pos:[.55,.22,1.15],at:[0,.07,0],yaw:.35})],['feet from the side',(h)=>({pos:[1.3,.3,.25],at:[0,.1,.05],yaw:0})],['shoulder and arm',(h)=>({pos:[.25,h*.72,1.25],at:[0,h*.62,0],yaw:.25})],['elbow bent',(h)=>({pos:[.9,h*.7,1.25],at:[.1,h*.62,0],yaw:.5,gesture:'Wave'})],['waist and hem',(h)=>({pos:[.5,h*.42,1.3],at:[0,h*.38,0],yaw:.3})],['whole',(h)=>({pos:[.6,h*.55,h*2.6+1.2],at:[0,h*.5,0],yaw:.35})]];
const TW=300,TH=300,COLS=VIEWS.length,rows=names.length;
const out=document.createElement('canvas');out.width=TW*COLS;out.height=TH*rows;const g=out.getContext('2d');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(TW,TH);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf3efe6);
scene.add(new THREE.HemisphereLight(0xfffbf2,0xb8ab96,1.5));const sun=new THREE.DirectionalLight(0xfff3df,2.0);sun.position.set(-1.2,2.6,2.4);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshBasicMaterial({color:0xe6e0d2}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const cam=new THREE.PerspectiveCamera(26,1,.05,30);const built=[];
for(const [row,name] of names.entries()){
 for(const [col,[label,view]] of VIEWS.entries()){
  let a;try{a=buildAvatar(recipeFor(name),{shadows:false,faceSize:256});}catch(e){console.log('FAIL',name,e.message);continue;}
  const h=a.height||1.6,v=view(h);const holder=new THREE.Group();holder.rotation.y=Math.PI+v.yaw;holder.add(a.root);scene.add(holder);
  try{const an=createAvatarAnimator(a,{random:()=>.5,initialTime:0});if(v.gesture)an.play(v.gesture);for(let k=0;k<(v.gesture?14:20);k++)an.update(.05,{expression:'smile'});}catch(e){console.log('FAIL anim',e.message);}
  cam.position.set(...v.pos);cam.lookAt(...v.at);renderer.render(scene,cam);
  g.drawImage(renderer.domElement,col*TW,row*TH);g.fillStyle='#1f2a2e';g.font='600 13px sans-serif';g.textAlign='left';g.fillText(name+' · '+label,col*TW+8,row*TH+16);
  scene.remove(holder);
 }built.push(name);
}
document.body.replaceChildren(out);window.__SHEET__={done:true,built,size:[out.width,out.height]};
</script>
